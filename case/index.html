<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medcase — visualizador 3D</title>

    <link rel="stylesheet" href="../colors_and_type.css" />
    <link rel="stylesheet" href="../app.css" />
    <link rel="stylesheet" href="./style.css" />

    <!-- Tema antes da primeira pintura: sem isto, quem salvou "claro"
         vê o app escuro até o módulo carregar. Mesma chave nas duas telas. -->
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("medcase-viewer-theme") === "light" ? "light" : "dark";
      } catch (e) { /* storage bloqueado: fica no escuro, que é o padrão */ }
    </script>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/",
        "three/examples/jsm/": "https://unpkg.com/three@0.164.0/examples/jsm/",
        "n8ao": "https://esm.sh/n8ao@1.9.4?external=three",
        "manifold-3d": "https://unpkg.com/manifold-3d@3.5.3/manifold.js"
      }
    }
    </script>
  </head>
  <body>

    <div class="viewer">

      <header class="vw-top">
        <!-- Mobile: hamburger occupies the leftmost slot (per mobile_v2 handoff). -->
        <button class="pill icon-only vw-mobile-only vw-top-overflow"
                data-action="overflow-toggle"
                data-testid="overflow-toggle"
                aria-label="Menu"
                aria-haspopup="menu"
                aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <div class="vw-top-left vw-desktop-only">
          <span class="vw-brand" aria-label="Medcase por Biodesignlab">
            <span class="vw-brand-stack">
              <span class="vw-brand-product">Medcase</span>
              <span class="vw-brand-company">por Biodesignlab</span>
            </span>
          </span>
          <span class="vw-sep">/</span>
          <span class="vw-case-id">Caso <b data-bind="uid-short">—</b></span>
        </div>

        <div class="vw-top-right">
          <!-- Exame de imagem: layout do palco. Só aparece quando o caso tem exame. -->
          <div class="vw-layouts vw-desktop-only" role="group" aria-label="Layout das vistas" data-testid="layout-switcher" hidden>
            <button type="button" data-layout="3d" aria-pressed="true" aria-label="Só o 3D" title="Só o 3D" data-testid="layout-3d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/></svg></button>
            <button type="button" data-layout="3d+1" aria-pressed="false" aria-label="3D e um corte" title="3D e um corte" data-testid="layout-3d1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M13.5 4.5v15"/></svg></button>
            <button type="button" data-layout="3d+3" aria-pressed="false" aria-label="3D e três cortes" title="3D e três cortes" data-testid="layout-3d3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M14 4.5v15M14 9.5h6.5M14 14.5h6.5"/></svg></button>
            <button type="button" data-layout="quad" aria-pressed="false" aria-label="Quatro quadrantes" title="Quatro quadrantes" data-testid="layout-quad"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M12 4.5v15M3.5 12h17"/></svg></button>
          </div>
          <button type="button" class="pill vw-mobile-only view-picker" data-testid="view-picker"
                  aria-haspopup="dialog" aria-expanded="false" aria-label="Trocar a vista" hidden>
            <span class="view-picker-icon"></span>
            <span class="view-picker-name">Uma vista</span>
            <svg class="view-picker-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
          </button>

          <button class="pill ar-button"
                  data-testid="ar-button"
                  data-visible="false"
                  data-loading="false"
                  aria-label="Ver em AR">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V5a1 1 0 0 1 1-1h2"/><path d="M17 4h2a1 1 0 0 1 1 1v2"/><path d="M20 17v2a1 1 0 0 1-1 1h-2"/><path d="M7 20H5a1 1 0 0 1-1-1v-2"/><path d="M12 8l5 3v6l-5 3-5-3v-6z"/><path d="M12 8v6"/><path d="M17 11l-5 3-5-3"/></svg>
            <span class="label">AR</span>
          </button>

          <!-- Desktop chrome: theme toggle + Compartilhar live as their own pills. -->
          <button class="pill icon-only theme-toggle vw-desktop-only" data-action="theme-toggle" aria-label="Alternar tema">
            <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>

          <button class="pill primary vw-desktop-only" data-action="share">
            <span class="label">Compartilhar</span>
          </button>

        </div>

        <!-- Mobile overflow popover, anchored to the hamburger pill on open. -->
        <div class="overflow-menu vw-mobile-only"
             data-open="false"
             data-testid="overflow-menu"
             role="menu">
          <button class="overflow-item" data-action="theme-toggle" role="menuitem">
            <span class="ic">
              <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
              <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </span>
            <span class="lbl">
              <span class="l1 lbl-light">Modo escuro</span>
              <span class="l1 lbl-dark">Modo claro</span>
              <span class="l2 sub-light">Mudar para escuro</span>
              <span class="l2 sub-dark">Mudar para claro</span>
            </span>
          </button>
          <button class="overflow-item" data-action="share" role="menuitem">
            <span class="ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
            </span>
            <span class="lbl">
              <span class="l1">Compartilhar</span>
              <span class="l2">Link de acesso</span>
            </span>
          </button>
        </div>
      </header>

      <main class="vw-stage" data-layout="3d">
        <!-- A célula do 3D no palco. O canvas, as pílulas de medida (CSS2D, que
             se penduram no pai do canvas) e a vinheta ficam aqui dentro; zoom e
             barra de ferramentas ficam no palco, por cima da célula do 3D, que
             é sempre a do canto superior esquerdo. -->
        <div class="vw-3d">
          <canvas id="canvas"></canvas>
          <button type="button" class="mini3d-open" data-testid="mini3d-open" aria-label="Ver o 3D em tela cheia" hidden></button>
        </div>

        <!-- Celular, "Uma vista": qual vista ocupa o palco. -->
        <div class="view-tabs" role="tablist" aria-label="Vista" data-testid="view-tabs" hidden>
          <button type="button" role="tab" data-view="3d" aria-selected="true">3D</button>
          <button type="button" role="tab" data-view="axial" aria-selected="false"><span class="sv-dot" style="--plane: var(--w-plane-axial)" aria-hidden="true"></span>Axial</button>
          <button type="button" role="tab" data-view="coronal" aria-selected="false"><span class="sv-dot" style="--plane: var(--w-plane-coronal)" aria-hidden="true"></span>Coronal</button>
          <button type="button" role="tab" data-view="sagittal" aria-selected="false"><span class="sv-dot" style="--plane: var(--w-plane-sagittal)" aria-hidden="true"></span>Sagital</button>
        </div>

        <!-- Vistas de corte do exame (slice-view.js preenche). -->
        <section class="slice-view" data-plane="axial" hidden></section>
        <section class="slice-view" data-plane="coronal" hidden></section>
        <section class="slice-view" data-plane="sagittal" hidden></section>

        <div class="exam-hint-pill" data-testid="exam-hint" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7.5" y="3" width="13.5" height="13.5" rx="2.5"/><path d="M3.5 7.5v10.5A2.5 2.5 0 0 0 6 20.5h10.5"/><circle cx="14.25" cy="9.75" r="3.25"/></svg>
          <span>Este caso tem exame de imagem <span class="exam-hint-size"></span></span>
          <button type="button" data-testid="exam-open">Ver cortes</button>
        </div>

        <div class="vw-zoom" aria-label="Zoom">
          <button class="vw-zoom-btn" data-action="zoom-out" aria-label="Diminuir">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
          </button>
          <span class="vw-zoom-value" data-bind="zoom-pct">100%</span>
          <button class="vw-zoom-btn" data-action="zoom-in" aria-label="Aumentar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>

        <!-- Barra de ferramentas: o que age sobre o modelo fica junto dele, à
             esquerda do palco. Desfazer só aparece depois do primeiro corte
             (contour.js). -->
        <div class="vw-rail" data-testid="tool-rail" role="toolbar" aria-label="Ferramentas" aria-orientation="vertical" hidden>
          <!-- Só no celular: a barra vira o rodapé e Estruturas abre/fecha a gaveta. -->
          <button type="button" class="vw-rail-btn vw-rail-mobile-only"
                  data-testid="sheet-toggle"
                  aria-label="Estruturas"
                  aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
            <span>Estruturas</span>
          </button>
          <button type="button" class="vw-rail-btn vw-rail-mobile-only"
                  data-testid="exam-toggle"
                  aria-label="Exame"
                  aria-pressed="false"
                  hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="3" width="13.5" height="13.5" rx="2.5"/><path d="M3.5 7.5v10.5A2.5 2.5 0 0 0 6 20.5h10.5"/><circle cx="14.25" cy="9.75" r="3.25"/></svg>
            <span>Exame</span>
          </button>
          <button type="button" class="vw-rail-btn"
                  data-testid="measure-fab"
                  data-state="idle"
                  aria-label="Medir"
                  aria-haspopup="menu"
                  aria-expanded="false"
                  aria-pressed="false"
                  hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M11 9l2 2M15 5l2 2"/></svg>
            <span>Medir</span>
          </button>
          <button type="button" class="vw-rail-btn"
                  data-testid="contour-button"
                  aria-label="Cortar: desenhe um contorno e corte a parte da estrutura"
                  aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6.5" r="2.6"/><circle cx="6" cy="17.5" r="2.6"/><path d="M8.3 8L20 18.5M8.3 16L20 5.5"/></svg>
            <span>Cortar</span>
          </button>
          <span class="vw-rail-sep" data-rail="cut" hidden></span>
          <button type="button" class="vw-rail-btn" data-testid="cut-undo" data-rail="cut" aria-label="Desfazer o último corte" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            <span>Desfazer</span>
          </button>
        </div>

        <div id="loading" class="overlay" hidden>Carregando...</div>
        <div id="error" class="overlay error" hidden></div>
      </main>

      <aside class="vw-right">
        <aside id="structures-panel" class="panel">
          <div class="panel-handle"></div>
          <div class="panel-title">Estruturas <span class="panel-count" data-bind="structure-count">—</span></div>
          <!-- Só com exame: "Estruturas N | Exame" substituem o título. -->
          <div class="panel-tabs" role="tablist" aria-label="Painel lateral" hidden>
            <button type="button" role="tab" data-tab="structures" aria-selected="true" data-testid="structures-tab">Estruturas <span class="panel-count" data-bind="structure-count">—</span></button>
            <button type="button" role="tab" data-tab="exam" aria-selected="false" data-testid="exam-tab">Exame</button>
          </div>
          <ul id="structures-list"></ul>
          <div id="exam-panel" class="exam-panel" role="tabpanel" aria-label="Exame"></div>
        </aside>
      </aside>

    </div>

    <!-- Celular: seletor de vistas do exame (botão do topo). -->
    <div class="view-sheet-scrim" data-testid="view-sheet" hidden>
      <div class="view-sheet" role="dialog" aria-modal="true" aria-labelledby="view-sheet-title">
        <div class="view-sheet-handle" aria-hidden="true"></div>
        <div class="view-sheet-head">
          <h3 id="view-sheet-title">Vistas</h3>
          <button type="button" class="view-sheet-close" aria-label="Fechar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
          </button>
        </div>
        <div class="view-sheet-grid" role="radiogroup" aria-label="Vistas">
          <button type="button" role="radio" data-layout="single" aria-checked="true">
            <svg class="vs-prev" viewBox="0 0 44 60" aria-hidden="true"><rect x="1" y="1" width="42" height="58" rx="5"/></svg>
            <span class="vs-t">Uma vista</span><span class="vs-d">3D ou um corte por vez</span></button>
          <button type="button" role="radio" data-layout="3d+1" aria-checked="false">
            <svg class="vs-prev" viewBox="0 0 44 60" aria-hidden="true"><rect x="1" y="1" width="42" height="58" rx="5"/><path d="M1 30h42"/></svg>
            <span class="vs-t">3D + corte</span><span class="vs-d">Um em cima do outro</span></button>
          <button type="button" role="radio" data-layout="3d+3" aria-checked="false">
            <svg class="vs-prev" viewBox="0 0 44 60" aria-hidden="true"><rect x="1" y="1" width="42" height="58" rx="5"/><path d="M1 44h42M15 44v15M29 44v15"/></svg>
            <span class="vs-t">3D + 3 cortes</span><span class="vs-d">3D grande, cortes em miniatura</span></button>
          <button type="button" role="radio" data-layout="quad" aria-checked="false">
            <svg class="vs-prev" viewBox="0 0 44 60" aria-hidden="true"><rect x="1" y="1" width="42" height="58" rx="5"/><path d="M1 30h42M22 1v58"/></svg>
            <span class="vs-t">Quadrantes</span><span class="vs-d">As quatro vistas juntas</span></button>
        </div>
        <button type="button" role="switch" class="exam-switch view-sheet-switch" data-opt="mini3d" aria-checked="false" data-testid="switch-mini3d">
          <span class="exam-switch-track" aria-hidden="true"></span>
          <span class="vs-switch-text"><span>Mini-3D nos cortes</span><small>Mostra onde o corte está no corpo</small></span>
        </button>
      </div>
    </div>

    <!-- Share modal — opens via [data-action="share"] in the top bar. -->
    <div class="modal-scrim" data-testid="share-modal" role="dialog" aria-modal="true" aria-labelledby="share-title" hidden>
      <div class="modal">
        <div class="modal-h">
          <div>
            <h3 class="modal-ttl" id="share-title">Compartilhar</h3>
            <div class="modal-sub">Link de acesso ao caso 3D.</div>
          </div>
          <button class="modal-close" data-action="share-close" aria-label="Fechar">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div>
            <span class="field-label">Link</span>
            <div class="link-row">
              <input class="link-input" data-bind="share-link" readonly />
              <button class="link-copy" data-action="share-copy">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
                <span class="link-copy-label">Copiar</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="ar-root" class="ar-root" aria-hidden="true"></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
